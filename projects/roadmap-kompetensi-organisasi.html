<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Model Kompetensi & Manajemen Pengetahuan Organisasi</title>
  <style>
    :root {
      --bg: #ffffff;
      --canvas-bg: #ffffff;
      --dot-color: #cbd5e1;
      --card-bg: #ffffff;
      --card-border: #18181b;
      --yellow-main: #facc15;
      --yellow-sub: #fef08a;
      --yellow-light: #fefce8;
      --blue-accent: #2563eb;
      --blue-light: #eff6ff;
      --text-main: #09090b;
      --text-muted: #71717a;
      --border: #e4e4e7;
      --sidebar-width: 480px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--canvas-bg);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
    }

    /* Top Navbar */
    header.roadmap-nav {
      height: 56px;
      background: #ffffff;
      color: #09090b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1.5px solid var(--border);
      z-index: 30;
      flex-shrink: 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      background: #09090b;
      color: #ffffff;
      font-weight: 700;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: -0.3px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 600;
      color: #27272a;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      background: #f4f4f5;
      border: 1.5px solid #e4e4e7;
      color: #09090b;
      padding: 6px 12px 6px 32px;
      border-radius: 6px;
      font-size: 13px;
      width: 240px;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      background: #ffffff;
      border-color: #18181b;
      width: 300px;
    }

    .search-box svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      fill: #71717a;
    }

    .btn {
      background: #ffffff;
      color: #18181b;
      border: 1.5px solid #18181b;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .btn:hover {
      background: #f4f4f5;
    }

    .btn-yellow {
      background: var(--yellow-main);
      border-color: #18181b;
    }

    .btn-yellow:hover {
      background: #eab308;
    }

    /* Subheader Navigation Pills */
    .hero-banner {
      background: #ffffff;
      border-bottom: 1.5px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 20;
    }

    .hero-banner .title-info {
      font-size: 13px;
      font-weight: 600;
      color: #52525b;
    }

    .filter-pills {
      display: flex;
      gap: 8px;
    }

    .pill {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      cursor: pointer;
      border: 1.5px solid #e4e4e7;
      background: #ffffff;
      color: #52525b;
      transition: all 0.15s;
    }

    .pill:hover, .pill.active {
      background: #18181b;
      color: #ffffff;
      border-color: #18181b;
    }

    /* Canvas Area */
    .viewport-container {
      position: relative;
      flex: 1;
      overflow: hidden;
      background-color: var(--canvas-bg);
      background-image: radial-gradient(var(--dot-color) 1.2px, transparent 1.2px);
      background-size: 24px 24px;
      cursor: grab;
    }

    .viewport-container:active {
      cursor: grabbing;
    }

    #roadmap-svg {
      width: 100%;
      height: 100%;
      transform-origin: 0 0;
      user-select: none;
    }

    /* Floating View Controls */
    .floating-controls {
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: #ffffff;
      border: 1.5px solid #18181b;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 3px 3px 0px 0px rgba(24, 24, 27, 1);
      z-index: 10;
      overflow: hidden;
    }

    .ctrl-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-bottom: 1.5px solid #e4e4e7;
      color: #18181b;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
    }

    .ctrl-btn:last-child {
      border-bottom: none;
    }

    .ctrl-btn:hover {
      background: #f4f4f5;
    }

    /* Floating Legend */
    .floating-legend {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background: #ffffff;
      border: 1.5px solid #18181b;
      border-radius: 8px;
      padding: 10px 14px;
      box-shadow: 3px 3px 0px 0px rgba(24, 24, 27, 1);
      z-index: 10;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      color: #27272a;
    }

    .legend-color {
      width: 16px;
      height: 12px;
      border-radius: 3px;
      border: 1.5px solid #18181b;
    }

    /* Drawer */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(2px);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .detail-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--sidebar-width);
      max-width: 90vw;
      height: 100vh;
      background: #ffffff;
      border-left: 2px solid #18181b;
      box-shadow: -6px 0 24px rgba(0, 0, 0, 0.1);
      z-index: 50;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .detail-drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 18px 20px;
      border-bottom: 1.5px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      background: #fafafa;
    }

    .drawer-title {
      font-size: 17px;
      font-weight: 800;
      color: #09090b;
      line-height: 1.3;
      margin-top: 4px;
    }

    .close-btn {
      background: transparent;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #71717a;
      padding: 2px 6px;
      border-radius: 4px;
      line-height: 1;
    }

    .close-btn:hover {
      background: #e4e4e7;
      color: #09090b;
    }

    .drawer-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .info-card {
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }

    .info-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #71717a;
      margin-bottom: 6px;
    }

    .info-content {
      font-size: 13.5px;
      color: #18181b;
      line-height: 1.6;
    }

    .example-card {
      background: #fefce8;
      border: 1.5px solid #ca8a04;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      color: #713f12;
      line-height: 1.55;
    }

    .drawer-footer {
      padding: 14px 20px;
      border-top: 1.5px solid var(--border);
      background: #fafafa;
      display: flex;
      gap: 10px;
    }

    /* SVG Styling */
    .node-elem {
      cursor: pointer;
      transition: filter 0.15s, opacity 0.15s;
    }

    .node-elem:hover rect {
      filter: brightness(0.96);
    }

    .node-elem.highlighted rect {
      stroke: #ef4444 !important;
      stroke-width: 3px !important;
    }

    .node-elem.dimmed {
      opacity: 0.2;
    }

    .node-elem.completed rect {
      stroke: #16a34a !important;
      stroke-width: 3px !important;
    }

    /* Node Text */
    .txt-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      fill: #18181b;
    }

    .txt-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      fill: #18181b;
    }

    .txt-group-header {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      fill: #18181b;
    }

    /* Connectors */
    .line-spine {
      stroke: #2563eb;
      stroke-width: 2.5px;
      fill: none;
    }

    .line-branch {
      stroke: #2563eb;
      stroke-width: 2px;
      stroke-dasharray: 4 4;
      fill: none;
    }

    .line-direct {
      stroke: #18181b;
      stroke-width: 2px;
      fill: none;
    }
  </style>
</head>

    // ZOOM & PAN LOGIC
    let scale = 1;
    let pointX = 0;
    let pointY = 0;
    let startX = 0;
    let startY = 0;
    let isPanning = false;

    const viewport = document.getElementById("viewport");
    const svg = document.getElementById("roadmap-svg");
    const content = document.getElementById("canvas-content");

    function updateTransform() {
      content.setAttribute("transform", `translate(${pointX}, ${pointY}) scale(${scale})`);
    }

    viewport.addEventListener("mousedown", (e) => {
      if (e.target.closest(".node-elem")) return;
      isPanning = true;
      startX = e.clientX - pointX;
      startY = e.clientY - pointY;
    });

    window.addEventListener("mousemove", (e) => {
      if (!isPanning) return;
      pointX = e.clientX - startX;
      pointY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener("mouseup", () => {
      isPanning = false;
    });

    viewport.addEventListener("wheel", (e) => {
      e.preventDefault();
      const xs = (e.clientX - pointX) / scale;
      const ys = (e.clientY - pointY) / scale;
      const delta = -e.deltaY;

      if (delta > 0) {
        scale = Math.min(scale * 1.15, 3.0);
      } else {
        scale = Math.max(scale / 1.15, 0.35);
      }

      pointX = e.clientX - xs * scale;
      pointY = e.clientY - ys * scale;
      updateTransform();
    });

    function zoomIn() {
      scale = Math.min(scale * 1.2, 3.0);
      updateTransform();
    }

    function zoomOut() {
      scale = Math.max(scale / 1.2, 0.35);
      updateTransform();
    }

    function resetZoom() {
      scale = 1;
      pointX = 0;
      pointY = 0;
      updateTransform();
      const allNodes = document.querySelectorAll(".node-elem");
      allNodes.forEach(n => n.classList.remove("dimmed", "highlighted"));
    }

    // DRAWER / DETAIL PANEL
    let currentNodeId = null;
    const drawer = document.getElementById("detailDrawer");
    const backdrop = document.getElementById("drawerBackdrop");
    const completedSet = new Set();

    function openDrawer(nodeId) {
      currentNodeId = nodeId;
      const data = roadmapData[nodeId];
      if (!data) return;

      document.getElementById("drawerCategory").innerText = data.category;
      document.getElementById("drawerTitle").innerText = data.title;
      document.getElementById("drawerHakikat").innerHTML = data.hakikat;
      document.getElementById("drawerSumber").innerHTML = data.sumber;
      document.getElementById("drawerTurunan").innerHTML = data.turunan;
      document.getElementById("drawerExample").innerHTML = data.example;
      document.getElementById("drawerDependensi").innerHTML = data.dependensi;

      const btn = document.getElementById("markDoneBtn");
      const isDone = completedSet.has(nodeId);
      btn.innerText = isDone ? "✓ Selesai Dipelajari (Batalkan)" : "Tandai Penguasaan";
      btn.className = isDone ? "btn" : "btn btn-yellow";

      drawer.classList.add("open");
      backdrop.classList.add("open");
    }

    function closeDrawer() {
      drawer.classList.remove("open");
      backdrop.classList.remove("open");
    }

    function toggleCurrentNodeDone() {
      if (!currentNodeId) return;
      const el = document.getElementById("node-" + currentNodeId);
      if (completedSet.has(currentNodeId)) {
        completedSet.delete(currentNodeId);
        if (el) el.classList.remove("completed");
      } else {
        completedSet.add(currentNodeId);
        if (el) el.classList.add("completed");
      }
      openDrawer(currentNodeId);
    }

    // SEARCH FILTER
    function handleSearch(query) {
      const q = query.trim().toLowerCase();
      const allNodes = document.querySelectorAll(".node-elem");

      if (!q) {
        allNodes.forEach(n => n.classList.remove("dimmed", "highlighted"));
        return;
      }

      allNodes.forEach(node => {
        const id = node.id.replace("node-", "");
        const data = roadmapData[id];
        let match = false;

        if (data) {
          const haystack = (data.title + " " + data.hakikat + " " + data.turunan + " " + data.example + " " + data.sumber).toLowerCase();
          if (haystack.includes(q)) match = true;
        }

        if (match) {
          node.classList.remove("dimmed");
          node.classList.add("highlighted");
        } else {
          node.classList.add("dimmed");
          node.classList.remove("highlighted");
        }
      });
    }

    // GROUP FILTER
    function filterDomain(domain, pillEl) {
      document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
      if (pillEl) pillEl.classList.add("active");

      const allNodes = document.querySelectorAll(".node-elem");
      allNodes.forEach(n => n.classList.remove("dimmed", "highlighted"));

      if (domain === "all") return;

      allNodes.forEach(node => {
        const id = node.id.replace("node-", "");
        const data = roadmapData[id];
        if (!data) return;

        let match = false;
        if (domain === "fondasi" && (id.startsWith("KB") || id.startsWith("RO"))) match = true;
        if (domain === "dwp" && (id.startsWith("ORG") || id.startsWith("JF") || id.startsWith("KJ") || id.startsWith("KM") || id.startsWith("KF") || id.startsWith("VBL") || id.startsWith("FVE"))) match = true;
        if (domain === "lms" && (id.startsWith("LR") || id.startsWith("CT"))) match = true;
        if (domain === "uk" && (id.startsWith("LA") || id.startsWith("AS"))) match = true;

        if (!match) {
          node.classList.add("dimmed");
        }
      });
    }

    // EXPORT ROADMAP
    function exportSVG() {
      const svgData = new XMLSerializer().serializeToString(svg);
      const blob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "roadmap-kompetensi-organisasi.svg";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // KEYBOARD ESC
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeDrawer();
    });
  </script>
